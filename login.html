<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MedIntellect Academy</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #123b73;
            --primary-light: #edf4ff;
            --bg: #f7f9fc;
            --surface: #ffffff;
            --text: #172033;
            --heading: #111827;
            --muted: #697386;
            --border: #dfe5ee;
            --error: #c62828;
        }

        body.dark {
            --primary: #72aaff;
            --primary-light: #1c3558;
            --bg: #0b1220;
            --surface: #111a2b;
            --text: #e6edf7;
            --heading: #ffffff;
            --muted: #aab5c7;
            --border: #29374d;
            --error: #ff8585;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            transition: .25s ease;
        }

        .topbar {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--surface);
            cursor: pointer;
            font-size: 17px;
        }

        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px 60px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 15px 40px rgba(20, 40, 70, .07);
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading h1 {
            color: var(--heading);
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: var(--muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: var(--heading);
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
        }

        input:focus {
            border-color: var(--primary);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--muted);
            font-size: 13px;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -5px;
            margin-bottom: 20px;
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: 800;
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 17px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
        }

        .message.error {
            display: block;
            color: var(--error);
            background: rgba(198, 40, 40, .08);
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 14px;
        }

        .signup-text a {
            color: var(--primary);
            font-weight: 800;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--muted);
            font-size: 13px;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 25px 20px;
            }

            .heading h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <a href="index.html" class="logo">
        <div class="logo-icon">M</div>
        MedIntellect Academy
    </a>

    <button
        class="theme-toggle"
        id="themeToggle"
        aria-label="Toggle theme">
        🌙
    </button>

</header>


<main class="page">

    <div class="login-card">

        <div class="heading">
            <h1>Welcome back</h1>
            <p>Log in to continue your learning.</p>
        </div>


        <div id="message" class="message"></div>


        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        class="show-password"
                        id="showPassword">
                        Show
                    </button>

                </div>

            </div>


            <a href="#" class="forgot" id="forgotPassword">
                Forgot password?
            </a>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn">
                Log In
            </button>

        </form>


        <p class="signup-text">
            Don't have an account?
            <a href="signup.html">Create one</a>
        </p>


        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

</main>


<script>

/* =========================
   THEME
========================= */

const themeToggle =
    document.getElementById("themeToggle");

const savedTheme =
    localStorage.getItem("medintellect-theme");

if (savedTheme === "dark") {
    document.body.classList.add("dark");
    themeToggle.textContent = "☀️";
}

themeToggle.addEventListener("click", function () {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    themeToggle.textContent =
        dark ? "☀️" : "🌙";

    localStorage.setItem(
        "medintellect-theme",
        dark ? "dark" : "light"
    );

});


/* =========================
   SHOW PASSWORD
========================= */

const password =
    document.getElementById("password");

const showPassword =
    document.getElementById("showPassword");

showPassword.addEventListener("click", function () {

    if (password.type === "password") {

        password.type = "text";
        showPassword.textContent = "Hide";

    } else {

        password.type = "password";
        showPassword.textContent = "Show";

    }

});


/* =========================
   LOGIN
========================= */

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");

const submitBtn =
    document.getElementById("submitBtn");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.className = "message";
    message.textContent = "";

    const email =
        document.getElementById("email").value.trim();

    const passwordValue =
        document.getElementById("password").value;


    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";


    try {

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,
                password: passwordValue

            });


        if (error) {
            throw error;
        }


        message.className = "message";
        message.textContent = "Login successful.";


        window.location.href =
            "dashboard.html";


    } catch (error) {

        message.className =
            "message error";

        message.textContent =
            error.message ||
            "Unable to log in. Please check your details.";

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";

    }

});


/* =========================
   FORGOT PASSWORD
========================= */

const forgotPassword =
    document.getElementById("forgotPassword");


forgotPassword.addEventListener("click", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();


    if (!email) {

        message.className =
            "message error";

        message.textContent =
            "Enter your email address first.";

        return;
    }


    try {

        const { error } =
            await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );


        if (error) {
            throw error;
        }


        message.className =
            "message";

        message.textContent =
            "Password reset instructions have been sent to your email.";

    } catch (error) {

        message.className =
            "message error";

        message.textContent =
            error.message ||
            "Unable to send password reset email.";

    }

});

</script>

</body>
                  </html>
